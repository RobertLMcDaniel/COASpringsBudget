<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>City Information | Altamonte Springs</title>

  <style>
    :root {
      --page-bg: #073f42;
      --card-bg: #0b4b4f;
      --border: rgba(255,255,255,.24);
      --text: #ffffff;
      --muted: rgba(255,255,255,.78);
      --accent: #2cc7c4;
      --overlay-top: rgba(3,40,43,.30);
      --overlay-bottom: rgba(3,40,43,.92);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Segoe UI", Aptos, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .portal {
      width: min(1600px, 100%);
      min-height: min(82vh, 820px);

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      border: 1px solid var(--border);
      border-radius: 32px;
      overflow: hidden;

      background: var(--card-bg);
      box-shadow: 0 24px 70px rgba(0,0,0,.18);
    }

    .portal-card {
      position: relative;
      min-height: 720px;
      overflow: hidden;

      color: var(--text);
      text-decoration: none;

      isolation: isolate;
    }

    .portal-card + .portal-card {
      border-left: 1px solid var(--border);
    }

    .portal-card__image {
      position: absolute;
      inset: 0;
      z-index: -3;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      transform: scale(1.001);

      transition:
        transform 700ms cubic-bezier(.2,.7,.2,1),
        filter 700ms cubic-bezier(.2,.7,.2,1);
    }

    .portal-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;

      background:
        linear-gradient(
          to bottom,
          var(--overlay-top) 0%,
          rgba(3,40,43,.45) 44%,
          var(--overlay-bottom) 100%
        );
    }

    .portal-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      background:
        radial-gradient(
          circle at 78% 18%,
          rgba(67,213,206,.11),
          transparent 34%
        );

      opacity: 0;
      transition: opacity 500ms ease;
    }

    .portal-card__content {
      min-height: inherit;
      height: 100%;

      padding: 52px 56px 44px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 40px;
    }

    .portal-card__title {
      margin: 0;
      max-width: 640px;

      font-size: clamp(3rem, 4.4vw, 5.5rem);
      font-weight: 350;
      line-height: .95;
      letter-spacing: -.055em;
    }

    .portal-card__footer {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 28px;
      align-items: end;
    }

    .portal-card__description {
      max-width: 560px;
      margin: 0;

      color: var(--muted);
      font-size: clamp(1rem, 1.25vw, 1.3rem);
      line-height: 1.45;
    }

    .portal-card__arrow {
      width: 64px;
      height: 64px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: rgba(255,255,255,.10);

      transition:
        transform 350ms ease,
        background 350ms ease;
    }

    .portal-card__arrow svg {
      width: 29px;
      height: 29px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .portal-card:hover .portal-card__image,
    .portal-card:focus-visible .portal-card__image {
      transform: scale(1.045);
      filter: saturate(1.04) brightness(1.04);
    }

    .portal-card:hover::after,
    .portal-card:focus-visible::after {
      opacity: 1;
    }

    .portal-card:hover .portal-card__arrow,
    .portal-card:focus-visible .portal-card__arrow {
      background: var(--accent);
      transform: translateX(5px);
    }

    .portal-card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: -6px;
    }

    .load-error {
      max-width: 760px;
      margin: 40px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      body {
        padding: 18px;
      }

      .portal {
        grid-template-columns: 1fr;
        border-radius: 24px;
      }

      .portal-card {
        min-height: 620px;
      }

      .portal-card + .portal-card {
        border-left: none;
        border-top: 1px solid var(--border);
      }

      .portal-card__content {
        padding: 38px 32px 32px;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .portal-card {
        min-height: 560px;
      }

      .portal-card__content {
        padding: 30px 24px 24px;
      }

      .portal-card__footer {
        gap: 18px;
      }

      .portal-card__arrow {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>

<body>

  <main id="portal" class="portal" aria-label="City information"></main>

  <script>
    async function loadHomepage() {

      /*
        All homepage content is loaded from:
        data/site-config.json
      */

      const response = await fetch("data/site-config.json");

      if (!response.ok) {
        throw new Error(
          `Could not load data/site-config.json (${response.status})`
        );
      }

      const config = await response.json();

      /*
        Browser tab title
      */
      document.title =
        config.pageTitle ||
        config.siteName ||
        document.title;


      /*
        Theme settings from JSON
      */
      if (config.theme) {
        const root = document.documentElement;

        if (config.theme.background) {
          root.style.setProperty(
            "--page-bg",
            config.theme.background
          );
        }

        if (config.theme.cardBackground) {
          root.style.setProperty(
            "--card-bg",
            config.theme.cardBackground
          );
        }

        if (config.theme.accent) {
          root.style.setProperty(
            "--accent",
            config.theme.accent
          );
        }
      }


      /*
        Build cards from JSON
      */
      const portal =
        document.getElementById("portal");

      portal.innerHTML = "";

      config.cards.forEach((card, index) => {

        const link =
          document.createElement("a");

        link.className = "portal-card";
        link.href = card.link || "#";

        /*
          Stores the friendly card name
          from the JSON.
        */
        if (card.name) {
          link.dataset.name = card.name;
          link.setAttribute(
            "aria-label",
            card.name
          );
        }

        if (card.openInNewTab) {
          link.target = "_blank";
          link.rel =
            "noopener noreferrer";
        }


        /*
          Card background image
        */
        const image =
          document.createElement("img");

        image.className =
          "portal-card__image";

        image.src = card.image;
        image.alt =
          card.imageAlt || "";

        image.style.objectPosition =
          card.imagePosition ||
          "center";


        /*
          Card content
        */
        const content =
          document.createElement("div");

        content.className =
          "portal-card__content";


        const heading =
          document.createElement(
            index === 0
              ? "h1"
              : "h2"
          );

        heading.className =
          "portal-card__title";

        heading.innerHTML =
          card.title;


        const footer =
          document.createElement("div");

        footer.className =
          "portal-card__footer";


        const description =
          document.createElement("p");

        description.className =
          "portal-card__description";

        description.textContent =
          card.description;


        const arrow =
          document.createElement("span");

        arrow.className =
          "portal-card__arrow";

        arrow.setAttribute(
          "aria-hidden",
          "true"
        );

        arrow.innerHTML = `
          <svg viewBox="0 0 32 32">
            <path d="M6 16h19"></path>
            <path d="m18 9 7 7-7 7"></path>
          </svg>
        `;


        footer.append(
          description,
          arrow
        );

        content.append(
          heading,
          footer
        );

        link.append(
          image,
          content
        );

        portal.appendChild(link);
      });
    }


    /*
      Helpful error if the JSON path
      or filename is wrong.
    */
    loadHomepage().catch(error => {

      console.error(error);

      document.body.innerHTML = `
        <div class="load-error">

          <h1>
            Homepage data could not be loaded.
          </h1>

          <p>
            Make sure
            <strong>data/site-config.json</strong>
            exists in your GitHub repository
            and that GitHub Pages has finished
            deploying the latest commit.
          </p>

        </div>
      `;
    });
  </script>

</body>
</html>
